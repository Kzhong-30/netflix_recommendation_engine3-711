version: '3.8'

services:
  # FastAPI 推荐服务
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netflix-recommendation-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
      - UVICORN_WORKERS=1
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    networks:
      - recommendation-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: netflix-recommendation-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - recommendation-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: redis-server --appendonly yes

volumes:
  redis-data:
    driver: local

networks:
  recommendation-network:
    driver: bridge
